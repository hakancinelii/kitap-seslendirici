<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kitap Seslendirici</title>

  <meta name="theme-color" content="#79290f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ahlak ve Dogma" />

  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="stylesheet" href="/style.css" />

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="title" id="bookTitle">Kitap</span></div>
    <div class="controls">
      <label class="file-btn">
        <input type="file" id="refInput" accept="audio/*" />
        <span id="refLabel">🎤 Referans ses yükle</span>
      </label>
      <input type="text" id="controlInput" class="control-input"
             placeholder="Ses yönergesi (opsiyonel)" />
      <button id="playBtn" class="btn primary">▶ Oynat</button>
      <button id="stopBtn" class="btn">■ Durdur</button>
      <button id="revoiceBtn" class="btn" disabled title="Seçili cümleyi yeniden seslendir">↻ Yeniden seslendir</button>
    </div>
    <div class="progress-mini"><span id="progressText">…</span></div>
  </header>

  <div class="player-bar" id="playerBar">
    <div class="player-status" id="playerStatus">Hazır değil</div>
    <div class="player-text" id="playerText"></div>
  </div>

  <main id="book" class="book"></main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
  <script src="/app.js"></script>
</body>
</html>
